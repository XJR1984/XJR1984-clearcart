name: ClearCart natural narration asset
on:
  push:
    paths:
      - ".github/workflows/clearcart-natural-voice.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch voice asset and validate format
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          curl --fail --location --retry 2 --silent --show-error \
            'https://resource2.heygen.ai/text_to_speech/d7d7fb51ea2c4040af53f8b407db2973/1d9e45674c7b487fa61ff0cbaed0d1d4/id=c6c2fbcba75e4ceb97bfe6c139bc0c22.wav' \
            -o export/ClearCart_Friendly_Female_Tori.wav
          test $(stat -c%s export/ClearCart_Friendly_Female_Tori.wav) -gt 150000
          file export/ClearCart_Friendly_Female_Tori.wav
          python3 - <<'PY'
          import wave
          with wave.open('export/ClearCart_Friendly_Female_Tori.wav') as audio:
              print('sample_rate', audio.getframerate())
              print('duration_seconds', audio.getnframes()/audio.getframerate())
          PY
          sha256sum export/ClearCart_Friendly_Female_Tori.wav > export/voice_sha256.txt
      - name: Keep rendered narration as downloadable evidence
        uses: actions/upload-artifact@v4
        with:
          name: ClearCart-Female-Commercial-Narration
          path: export/
          retention-days: 7
