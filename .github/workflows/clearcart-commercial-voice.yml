name: ClearCart commercial neural voice
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/clearcart-commercial-voice.yml"
      - "scripts/demo/natural_tts.py"
permissions:
  contents: read
jobs:
  voice:
    name: Generate neural voice and provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install neural voice tools
        run: |
          python -m pip install --disable-pip-version-check piper-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Download licensed high-quality neural voice model
        run: |
          mkdir -p .voice_models
          python -m piper.download_voices --data-dir .voice_models en_GB-cori-high
      - name: Generate timed commercial narration
        run: python scripts/demo/natural_tts.py
      - name: Upload narration and timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ClearCart-Neural-Voiceover
          path: artifacts/clearcart-commercial/
          retention-days: 7
