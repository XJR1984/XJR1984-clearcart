<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="ClearCart architecture: need and budget to trained intent classifier, optimized plan, user approval and PayPal sandbox verification">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090F1F"/><stop offset="1" stop-color="#132339"/></linearGradient>
<linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D7F35C"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<filter id="shadow"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<circle cx="1650" cy="125" r="400" fill="#22D3EE" opacity=".05"/>
<path d="M0 880Q730 625 1920 960" fill="none" stroke="#D7F35C" opacity=".12" stroke-width="2"/>
<text x="105" y="118" font-family="Arial,sans-serif" font-size="46" fill="#F7F6EF" font-weight="800">ClearCart<tspan fill="#D7F35C">.</tspan></text>
<text x="105" y="221" font-family="Arial,sans-serif" font-size="65" font-weight="800" fill="#F7F6EF" letter-spacing="-2">FROM INTENT TO APPROVAL</text>
<text x="105" y="270" font-family="Arial,sans-serif" font-size="26" fill="#AFC4CF">A constrained, explainable prototype with a human-controlled checkout</text>
<g font-family="Arial,sans-serif">
<rect x="105" y="353" width="315" height="380" rx="28" fill="#172C3A" stroke="#607D8D" stroke-opacity=".55"/>
<text x="133" y="415" font-size="18" fill="#D7F35C" letter-spacing="2.5">01 / INPUT</text><text x="133" y="490" font-size="38" font-weight="700" fill="#F7F6EF">Need + budget</text><text x="133" y="550" font-size="24" fill="#B2C6CE">Plain-language task</text><text x="133" y="587" font-size="24" fill="#B2C6CE">Spending limit</text><text x="133" y="624" font-size="24" fill="#B2C6CE">Already-owned items</text><rect x="133" y="666" width="203" height="11" rx="6" fill="#D7F35C" opacity=".9"/>
<path d="M420 543H461" stroke="url(#glow)" stroke-width="5"/><path d="M461 543l-16-12v24Z" fill="#D7F35C"/>
<rect x="477" y="353" width="315" height="380" rx="28" fill="#172C3A" stroke="#607D8D" stroke-opacity=".55"/>
<text x="505" y="415" font-size="18" fill="#D7F35C" letter-spacing="2.5">02 / CLASSIFY</text><text x="505" y="482" font-size="35" font-weight="700" fill="#F7F6EF">Recognize</text><text x="505" y="527" font-size="35" font-weight="700" fill="#F7F6EF">the intent</text><text x="505" y="593" font-size="24" fill="#B2C6CE">Small trained</text><text x="505" y="631" font-size="24" fill="#B2C6CE">Naive Bayes model</text><text x="505" y="679" font-size="19" fill="#93A4B5">Declines unsupported tasks</text>
<path d="M792 543H833" stroke="url(#glow)" stroke-width="5"/><path d="M833 543l-16-12v24Z" fill="#D7F35C"/>
<rect x="849" y="353" width="315" height="380" rx="28" fill="#172C3A" stroke="#607D8D" stroke-opacity=".55"/>
<text x="877" y="415" font-size="18" fill="#D7F35C" letter-spacing="2.5">03 / OPTIMIZE</text><text x="877" y="488" font-size="35" font-weight="700" fill="#F7F6EF">Explain the cart</text><text x="877" y="549" font-size="24" fill="#B2C6CE">Exact-cent constraints</text><text x="877" y="587" font-size="24" fill="#B2C6CE">Need coverage</text><text x="877" y="625" font-size="24" fill="#B2C6CE">Reasons and tradeoffs</text><text x="877" y="680" font-size="19" fill="#93A4B5">32 illustrative products</text>
<path d="M1164 543H1205" stroke="url(#glow)" stroke-width="5"/><path d="M1205 543l-16-12v24Z" fill="#D7F35C"/>
<rect x="1221" y="353" width="585" height="380" rx="28" fill="#1D3541" stroke="#D7F35C" stroke-opacity=".55"/>
<text x="1254" y="415" font-size="18" fill="#D7F35C" letter-spacing="2.5">04 / HUMAN APPROVAL + SANDBOX</text>
<text x="1254" y="486" font-size="40" font-weight="700" fill="#F7F6EF">You control checkout.</text>
<text x="1254" y="557" font-size="25" fill="#B2C6CE">PayPal sandbox Orders v2</text>
<text x="1254" y="600" font-size="25" fill="#B2C6CE">Explicit buyer approval</text>
<text x="1254" y="643" font-size="25" fill="#B2C6CE">Verify captured status + amount</text>
<text x="1254" y="687" font-size="18" fill="#D7F35C">REAL SANDBOX CAPTURE NOT YET VERIFIED</text>
</g>
<path d="M105 833H1805" stroke="#82A6A5" opacity=".35"/>
<text x="105" y="902" font-family="Arial,sans-serif" font-size="29" fill="#F7F6EF" font-weight="700">A product is suggested. A payment is never automatic.</text>
<text x="105" y="950" font-family="Arial,sans-serif" font-size="22" fill="#91A6B2">Synthetic catalog · Test money only · Demonstration architecture, not a production retail platform</text>
</svg>